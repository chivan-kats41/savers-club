# TLS: put fullchain.pem / privkey.pem in deploy/certs (Let's Encrypt via certbot is fine).
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/s;

server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name _;
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 10m;           # matches DATA_UPLOAD_MAX_MEMORY_SIZE

  location /media/ { alias /srv/media/; add_header X-Content-Type-Options nosniff; add_header Content-Security-Policy "default-src 'none'"; }

  location ~ ^/accounts/(login|register|password-reset|verify-phone|2fa) {
    limit_req zone=auth burst=10 nodelay;
    proxy_pass http://web:8000;
    include /etc/nginx/conf.d/proxy_params.inc;
  }
  location / {
    limit_req zone=api burst=120 nodelay;
    proxy_pass http://web:8000;
    include /etc/nginx/conf.d/proxy_params.inc;
  }
}

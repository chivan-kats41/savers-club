<div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-3 mb-5 animate-fade-in-up">
  <div>
    <h1 class="text-xl sm:text-2xl font-semibold tracking-tight">{{ title }}</h1>
    {% if description %}<p class="text-sm text-muted-foreground mt-1">{{ description }}</p>{% endif %}
  </div>
  {% if action_url %}
  <a href="{{ action_url }}" class="h-9 px-3 text-sm rounded-lg bg-primary text-primary-foreground inline-flex items-center gap-1.5 press-scale hover:opacity-90">
    {% if action_icon %}<i data-lucide="{{ action_icon }}" class="h-4 w-4"></i>{% endif %} {{ action_label }}
  </a>
  {% endif %}
</div>

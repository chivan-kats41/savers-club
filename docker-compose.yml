# Production-style stack: nginx (TLS terminates here or at your load balancer) -> gunicorn, MySQL, Redis, Celery worker + beat.
# Usage: cp .env.example .env && edit it, then: docker compose up -d --build
#        docker compose exec web python manage.py migrate
#        docker compose exec web python manage.py seed_system_settings && seed_subscription_plans && seed_admin_group
x-app: &app
  build: .
  env_file: .env
  environment:
    DB_HOST: db
    REDIS_URL: redis://redis:6379/1
    CELERY_BROKER_URL: redis://redis:6379/0
  depends_on: [db, redis]
  volumes:
    - media:/app/media
    - private_media:/app/private_media
  restart: unless-stopped

services:
  web:
    <<: *app
  worker:
    <<: *app
    command: celery -A config worker -l info
  beat:
    <<: *app
    command: celery -A config beat -l info
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes: [dbdata:/var/lib/mysql]
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redisdata:/data]
    restart: unless-stopped
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/proxy_params.inc:/etc/nginx/conf.d/proxy_params.inc:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - media:/srv/media:ro          # public offer photos ONLY (private_media is not mounted here)
    depends_on: [web]
    restart: unless-stopped

volumes: {dbdata: {}, redisdata: {}, media: {}, private_media: {}}

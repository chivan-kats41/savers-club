{% extends "hub/base.html" %}
{% block title %}Two-factor check — 1K Saver Club{% endblock %}
{% block body %}
<div class="min-h-screen flex items-center justify-center bg-background px-4 py-12">
  <div class="w-full max-w-sm bg-card border border-border rounded-2xl shadow-sm p-8">
    <h1 class="text-xl font-bold mb-1">Two-factor check</h1>
    <p class="text-sm text-muted-foreground mb-5">Enter the 6-digit code from your authenticator app.</p>

    {% if error %}<div class="mb-4 text-sm rounded-lg px-3 py-2 bg-destructive/10 text-destructive">{{ error }}</div>{% endif %}
    <form method="post" class="space-y-4">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}" />
      <input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}" maxlength="7" required autofocus
             class="w-full h-12 text-center text-2xl tracking-widest font-mono rounded-xl border bg-background" placeholder="000000" />
      <button type="submit" class="w-full rounded-lg bg-primary text-primary-foreground font-semibold py-2.5 hover:opacity-90">Verify</button>
    </form>
    <form method="post" action="{% url 'accounts:logout' %}" class="mt-4 text-center">{% csrf_token %}<button class="text-xs text-muted-foreground underline">Sign out</button></form>
  </div>
</div>
{% endblock %}
